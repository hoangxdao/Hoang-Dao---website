<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hoang Dao, PhD</title>
<meta name="description" content="Hoang Dao, PhD. Applied microeconomist, Phenikaa University, Hanoi. Research, books, teaching, projects and the blog Ceteris Paribus, Mostly.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Be+Vietnam+Pro:wght@300;400;500;600;700&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=Cormorant+Garamond:wght@600;700&display=swap" rel="stylesheet">
<style>
/* Mix of the two designs: Wix layout (photo banner, overlapping portrait, button row, bookshelf footer)
   with the first version's type (Bricolage Grotesque, Be Vietnam Pro, Literata), stats strip and supply-and-demand chart.
   Palette: gold gradients on white-to-grey gradients, graphite for depth. Single light theme by design. */
:root{
  --ink:#1f2228; --graphite:#2b2f36; --muted:#5f6670; --line:#dde0e5; --paper:#ffffff; --mist:#f2f3f5;
  --gold:#d4a72c; --gold-d:#8a6510; --gold-l:#f3dc92;
  --g-gold:linear-gradient(135deg,#fbe7a6 0%,#e8bf4a 42%,#c9971c 72%,#a97a0e 100%);
  --g-gold-soft:linear-gradient(135deg,#fdf6df 0%,#f6e6b4 100%);
  --g-grey:linear-gradient(180deg,#ffffff 0%,#eef0f3 100%);
  --g-grey2:linear-gradient(180deg,#f7f8fa 0%,#e6e9ed 100%);
  --g-graphite:linear-gradient(160deg,#41464f 0%,#2a2e35 55%,#1d2025 100%);
  --f-head:"Bricolage Grotesque","Be Vietnam Pro",system-ui,sans-serif;
  --f-serif:"Cormorant Garamond","Literata",Georgia,serif;
  --f-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-read:"Literata",Georgia,serif;
  --wrap:1180px; --r:8px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:#f7f8fa;color:var(--ink);font-family:var(--f-body);font-weight:400;font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased}
a{color:var(--gold-d)}
img{max-width:100%;display:block}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.wrap{max-width:var(--wrap);margin:0 auto;padding:0 clamp(16px,4vw,48px)}
h1,h2,h3{font-family:var(--f-head);font-weight:800;line-height:1.1;margin:0;text-wrap:balance;letter-spacing:-.01em}
b,strong{font-weight:600}
.goldtext{background:var(--g-gold);-webkit-background-clip:text;background-clip:text;color:transparent}

/* top strip + header */
.featbar{display:flex;justify-content:center;align-items:center;gap:8px;background:var(--g-gold);color:#241b05;font:500 .9rem var(--f-body);padding:7px 16px;text-decoration:none;text-align:center;flex-wrap:wrap}
.featbar b{font-weight:700}
.featbar:hover u{color:#000}
.fb-tag{background:var(--graphite);color:var(--gold-l);font:700 .68rem var(--f-body);letter-spacing:.14em;text-transform:uppercase;padding:2px 7px;border-radius:3px}
@media (max-width:560px){.fb-txt{display:none}}
header.top{background:var(--g-grey);color:var(--ink);position:sticky;top:0;z-index:30;box-shadow:0 1px 0 var(--line),0 6px 18px rgba(30,34,40,.06)}
.top .wrap{display:flex;align-items:center;gap:16px;min-height:84px;flex-wrap:wrap;padding-top:8px;padding-bottom:8px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-head);font-weight:800;font-size:1.35rem;color:var(--ink);text-decoration:none;white-space:nowrap}
.seal{width:36px;height:36px;border-radius:8px;background:var(--g-gold);color:#241b05;display:grid;place-items:center;font:800 .95rem var(--f-head);letter-spacing:-.04em;box-shadow:inset 0 -2px 0 rgba(0,0,0,.12)}
.li{display:inline-flex;width:30px;height:30px;color:var(--graphite)}
.li svg{width:22px;height:22px;margin:auto}
nav.main{display:flex;gap:2px;flex:1;justify-content:center;flex-wrap:wrap}
nav.main a{font-family:var(--f-body);font-weight:500;font-size:.93rem;color:var(--muted);text-decoration:none;padding:7px 9px;border-radius:7px}
nav.main a:hover{color:var(--ink);background:rgba(0,0,0,.04)}
nav.main a[aria-current="page"]{color:#241b05;background:var(--g-gold-soft);box-shadow:inset 0 -2px 0 var(--gold)}
.tools{display:flex;gap:10px;align-items:center}
.search{display:flex;align-items:center;background:#fff;height:36px;width:140px;padding:0 10px;gap:6px;border:1px solid var(--line);border-radius:999px}
.search svg{width:16px;height:16px;flex:none;color:var(--muted)}
.search input{border:0;outline:0;font:400 14px var(--f-body);width:100%;color:var(--ink);background:transparent}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:#fff}
.lang button{border:0;background:transparent;color:var(--muted);font:600 12px var(--f-body);padding:7px 11px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--graphite);color:var(--gold-l)}
.menu-btn{display:none;background:#fff;border:1px solid var(--line);color:var(--ink);font:500 14px var(--f-body);padding:6px 12px;border-radius:8px}
@media (max-width:1120px){
  .menu-btn{display:block;margin-left:auto}
  nav.main{display:none;order:5;flex-basis:100%;flex-direction:column;align-items:flex-start;padding-bottom:10px}
  nav.main.open{display:flex}
  .tools{order:4;flex-basis:100%}
  .search{flex:1}
}

/* banner + hero */
.banner{background:#1d2025 center/cover no-repeat;position:relative}
.banner::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,rgba(29,32,37,.35) 0%,rgba(29,32,37,.62) 60%,rgba(120,88,14,.45) 100%)}
.hero-band{height:390px}
.hero{position:relative;display:grid;grid-template-columns:403px 1fr;gap:clamp(24px,6vw,140px);margin-top:-310px;z-index:2}
.portrait{padding:8px;background:var(--g-gold);border-radius:6px;box-shadow:0 18px 40px rgba(20,22,26,.28)}
.portrait img{width:100%;height:423px;object-fit:cover;border-radius:3px}
.hero-title{color:#fff;padding-top:60px}
.hero-title h1{font-size:clamp(2.6rem,4.8vw,3.6rem);color:#fff;letter-spacing:-.03em}
.hero-title h1 .phd{background:var(--g-gold);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero-title p{font-weight:300;font-size:clamp(1.05rem,1.7vw,1.35rem);line-height:1.3;margin:14px 0 0;color:#f1f2f4}
.btnrow{display:flex;gap:12px;margin-top:22px;flex-wrap:wrap}
.hero .btnrow{flex-wrap:nowrap;max-width:419px}.hero .btnrow .wbtn{flex:1;min-width:0;padding:0 8px;white-space:nowrap}
.wbtn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:44px;padding:0 22px;background:var(--g-gold);color:#241b05;text-decoration:none;font:600 15px var(--f-body);letter-spacing:.03em;border:0;border-radius:8px;cursor:pointer;box-shadow:inset 0 -2px 0 rgba(0,0,0,.12),0 4px 12px rgba(169,122,14,.22);transition:filter .15s,transform .15s}
.wbtn:hover{filter:brightness(1.06);transform:translateY(-1px)}
.wbtn.ghost{background:var(--g-grey);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.wbtn.dark{background:var(--g-graphite);color:var(--gold-l)}
.wbtn.sm{height:36px;padding:0 14px;font-size:13.5px}
.welcome{font-family:var(--f-read);font-size:1.04rem;line-height:1.8;margin-top:104px}
.welcome p{margin:0 0 1.2em}
.welcome p:first-child{font-family:var(--f-head);font-weight:700;font-size:1.3rem}
@media (max-width:900px){
  .hero{grid-template-columns:1fr}
  .portrait{max-width:330px}
  .portrait img{height:auto;aspect-ratio:403/423}
  .hero-title{padding-top:10px}
  .hero-title h1{color:var(--ink)} .hero-title p{color:var(--muted)}
  .hero-title h1 .phd{background:none;color:var(--gold-d)}
  .hero .btnrow .wbtn{font-size:14px}
  .welcome{margin-top:22px}
  .hero-band{height:220px}
  .hero{margin-top:-170px}
}

/* stats strip (from v1) */
.stats{display:grid;grid-template-columns:repeat(4,1fr);background:var(--g-grey);border:1px solid var(--line);border-radius:12px;margin:44px 0 0;overflow:hidden}
.stat{padding:20px 22px;border-right:1px solid var(--line)}
.stat:last-child{border-right:0}
.stat b{display:block;font:800 2.3rem/1.05 var(--f-head);font-variant-numeric:tabular-nums;background:var(--g-gold);-webkit-background-clip:text;background-clip:text;color:transparent}
.stat span{font-size:.88rem;color:var(--muted)}
@media (max-width:640px){.stats{grid-template-columns:repeat(2,1fr)}.stat:nth-child(2){border-right:0}.stat:nth-child(-n+2){border-bottom:1px solid var(--line)}}

/* page banner */
.pagehead{padding:56px 0 44px;color:#fff}
.pagehead .wrap{position:relative;z-index:2}
.pagehead h1{font-size:clamp(2.1rem,4.6vw,3.3rem);color:#fff;letter-spacing:-.03em}
.pagehead p{font-weight:300;font-size:1.15rem;margin:10px 0 0;max-width:62ch;color:#eceef1}
.crumb{font:600 .78rem var(--f-body);letter-spacing:.16em;text-transform:uppercase;color:var(--gold-l)}

section.sec{padding:60px 0}
section.sec.alt{background:var(--g-grey2)}
.sec-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:26px;flex-wrap:wrap}
.sec-head h2,h2.sub{font-size:clamp(1.65rem,3vw,2.2rem);color:var(--ink)}
.sec-head h2::after,h2.sub::after{content:"";display:block;width:64px;height:4px;border-radius:2px;background:var(--g-gold);margin-top:10px}
.sec-head a{font-weight:600;font-size:.95rem;color:var(--gold-d);text-decoration:none}
.sec-head a::after{content:" →"}
h2.sub{font-size:1.5rem;margin:46px 0 18px}
h3.subj{font-family:var(--f-serif);font-weight:700;font-size:1.5rem;color:var(--ink);margin:30px 0 8px;padding-bottom:6px;border-bottom:1px solid var(--line);position:relative}
h3.subj::after{content:"";position:absolute;left:0;bottom:-1px;width:120px;height:2px;background:var(--g-gold)}

.grid{display:grid;gap:20px}
.g3{grid-template-columns:repeat(3,1fr)} .g2{grid-template-columns:repeat(2,1fr)}
@media (max-width:900px){.g3{grid-template-columns:repeat(2,1fr)}}
@media (max-width:620px){.g3,.g2{grid-template-columns:1fr}}
.card{position:relative;background:linear-gradient(180deg,#ffffff 0%,#f6f7f9 100%);border:1px solid var(--line);border-radius:var(--r);padding:24px 22px 22px;display:flex;flex-direction:column;gap:10px;text-decoration:none;color:inherit;overflow:hidden;transition:box-shadow .15s,transform .15s}
.card::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:var(--g-gold)}
a.card:hover{box-shadow:0 12px 28px rgba(30,34,40,.12);transform:translateY(-2px)}
.card h3{font-size:1.16rem;font-weight:700;color:var(--ink)}
.card p{margin:0;font-size:.95rem;color:var(--muted)}
.kicker{font:600 .74rem var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--gold-d)}
.meta{font-size:.82rem;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap}
.cat{display:inline-flex;align-items:center;gap:6px;font:600 .72rem var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--gold-d)}
.cat svg{width:16px;height:16px}
.icon{stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* chart (from v1) */
.bloggrid{display:grid;grid-template-columns:.9fr 2.1fr;gap:22px;align-items:start}
@media (max-width:980px){.bloggrid{grid-template-columns:1fr}}
.chart{background:var(--g-grey);border:1px solid var(--line);border-radius:12px;padding:14px 14px 8px;margin:0}
.chart svg{display:block;width:100%;height:auto}
.chart .cap{font-size:.78rem;color:var(--muted);margin:4px 6px;font-style:italic;font-family:var(--f-read)}
.ax{stroke:var(--graphite);stroke-width:2}
.dcurve{stroke:url(#gGold);stroke-width:3.4;fill:none}
.scurve{stroke:#8d939c;stroke-width:3.4;fill:none}
.drop{stroke:#9aa0a8;stroke-dasharray:4 5;stroke-width:1.3}
.lbl{font:600 12.5px var(--f-body);fill:var(--ink)} .lbl.m{fill:var(--muted);font-weight:500} .lbl.a{fill:var(--gold-d)}
.eq{fill:var(--graphite)}
@media (prefers-reduced-motion:no-preference){
  .dcurve,.scurve{stroke-dasharray:420;animation:draw 1.4s ease-out both}.scurve{animation-delay:.25s}
  .eq{transform-box:fill-box;transform-origin:center;animation:pop .5s 1.3s both}
  @keyframes draw{from{stroke-dashoffset:420}to{stroke-dashoffset:0}}
  @keyframes pop{from{opacity:.25;transform:scale(.4)}to{opacity:1;transform:scale(1)}}
}

/* books */
.shelf{display:grid;grid-template-columns:repeat(7,1fr);gap:16px}
@media (max-width:900px){.shelf{grid-template-columns:repeat(4,1fr)}}
@media (max-width:520px){.shelf{grid-template-columns:repeat(2,1fr)}}
.cover{aspect-ratio:2/3;padding:14px 12px;color:#e9eaec;display:flex;flex-direction:column;justify-content:space-between;text-decoration:none;background:var(--g-graphite);border-radius:3px 8px 8px 3px;box-shadow:6px 8px 18px rgba(20,22,26,.22);position:relative;overflow:hidden;transition:transform .15s}
.cover::before{content:"";position:absolute;left:0;top:0;bottom:0;width:7px;background:var(--g-gold)}
.cover.gold{background:var(--g-gold);color:#241b05}.cover.gold::before{background:var(--g-graphite)}
.cover.gold b{background:none;-webkit-background-clip:initial;background-clip:initial;color:#241b05}
.cover:hover{transform:translateY(-4px) rotate(-.5deg)}
.cover b{font-family:var(--f-head);font-weight:800;font-size:1rem;line-height:1.12;background:var(--g-gold);-webkit-background-clip:text;background-clip:text;color:transparent;padding-left:4px}
.cover small{font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;opacity:.85;padding-left:4px}
.book{display:grid;grid-template-columns:130px 1fr;gap:26px;padding:26px 0;border-bottom:1px solid var(--line)}
.book:last-child{border-bottom:0}
.book h4{font-family:var(--f-head);font-weight:800;font-size:1.3rem;color:var(--ink);margin:0;line-height:1.2}
.book .subt{font-family:var(--f-serif);font-weight:600;font-size:1.15rem;color:var(--muted);margin:2px 0 8px}
.book .abs{font-family:var(--f-read);font-size:.98rem;line-height:1.72;margin:10px 0 14px;max-width:76ch}
@media (max-width:640px){.book{grid-template-columns:1fr}.book .cover{max-width:140px}}
.typetag{display:inline-block;font:700 .7rem var(--f-body);letter-spacing:.12em;text-transform:uppercase;background:var(--g-gold);color:#241b05;padding:3px 9px;border-radius:4px;margin-right:6px}

/* research */
.fields{display:grid;gap:12px}
details.field{border:1px solid var(--line);background:var(--g-grey);border-radius:var(--r);scroll-margin-top:140px;position:relative;overflow:hidden}
details.field::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:#c7cbd1}
details.field[open]::before{background:var(--g-gold)}
details.field>summary{cursor:pointer;list-style:none;padding:18px 22px 18px 26px;display:grid;grid-template-columns:1fr auto;gap:4px 16px;align-items:baseline}
details.field>summary::-webkit-details-marker{display:none}
.fname{font-family:var(--f-head);font-weight:700;font-size:1.22rem;color:var(--ink)}
.fname::before{content:"+";display:inline-block;width:1.2em;color:var(--gold-d)}
details.field[open] .fname::before{content:"−"}
.fcount{font-size:.84rem;color:var(--gold-d);font-weight:600}
.fprev{grid-column:1/-1;font-size:.88rem;color:var(--muted);padding-left:1.5em}
details.field[open] .fprev{display:none}
.fbody{padding:0 22px 6px 26px;background:#fff}
.paper{border-top:1px solid var(--line);padding:22px 0;display:grid;grid-template-columns:140px 1fr;gap:22px}
.paper .side{font-size:.8rem;color:var(--muted);display:grid;gap:4px;align-content:start}
.paper h3{font-size:1.12rem;font-weight:700;color:var(--ink);margin-bottom:4px}
.paper .auth{font-size:.93rem;margin:0 0 8px;color:var(--muted)}
.note{font-size:.82rem;color:var(--gold-d);font-weight:600}
details.abs-d summary{cursor:pointer;font-weight:600;font-size:.9rem;color:var(--gold-d);list-style:none}
details.abs-d summary::-webkit-details-marker{display:none}
details.abs-d summary::before{content:"+ "}
details.abs-d[open] summary::before{content:"− "}
.paper .abs{font-family:var(--f-read);font-size:.98rem;line-height:1.72;max-width:74ch;margin:10px 0 0}
.paper .kw{font-size:.82rem;color:var(--muted);margin:8px 0 12px}
@media (max-width:700px){.paper{grid-template-columns:1fr;gap:4px}}
.list{margin:0;padding:0;list-style:none;display:grid;gap:12px}
.list li{padding-left:20px;position:relative;max-width:85ch}
.list li::before{content:"";position:absolute;left:0;top:.7em;width:9px;height:9px;border-radius:2px;background:var(--g-gold)}
.tl div{display:grid;grid-template-columns:130px 1fr;gap:18px;padding:12px 0;border-bottom:1px solid var(--line)}
.tl b{color:var(--gold-d);font-weight:600;font-variant-numeric:tabular-nums}
@media (max-width:560px){.tl div{grid-template-columns:1fr;gap:0}}
.two{display:grid;grid-template-columns:1fr 1fr;gap:48px}
@media (max-width:860px){.two{grid-template-columns:1fr}}
.prose{font-family:var(--f-read);font-size:1.06rem;line-height:1.75}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.chip{border:1px solid var(--line);background:var(--g-grey);color:var(--ink);padding:6px 14px;border-radius:999px;font:500 .86rem var(--f-body);cursor:pointer;text-decoration:none}
.chip[aria-pressed="true"]{background:var(--g-gold);border-color:transparent;color:#241b05;font-weight:600}
.chip small{opacity:.7;margin-left:4px}

/* blog */
.blogsearch{width:100%;max-width:420px;border:1px solid var(--line);border-radius:999px;padding:10px 16px;font:400 15px var(--f-body);margin-bottom:18px;background:#fff}
.catdesc{font-family:var(--f-read);font-style:italic;color:var(--muted);margin:-6px 0 18px;min-height:1.4em}
.month{font:700 .8rem var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--gold-d);margin:30px 0 6px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.prow{display:grid;grid-template-columns:70px 1fr;gap:18px;padding:16px 0;border-bottom:1px solid var(--line);text-decoration:none;color:inherit}
.prow:hover h3{color:var(--gold-d)}
.prow .d{font:800 1.7rem/1 var(--f-head);font-variant-numeric:tabular-nums;color:var(--ink)}
.prow .d small{display:block;font:500 .72rem var(--f-body);color:var(--muted);margin-top:4px;letter-spacing:.06em;text-transform:uppercase}
.prow h3{font-size:1.18rem;font-weight:700;color:var(--ink);margin:2px 0 4px;transition:color .15s}
.prow p{margin:0;color:var(--muted);font-size:.95rem}
.post{max-width:740px}
.article{font-family:var(--f-read);font-size:1.1rem;line-height:1.8}
.article h2{font-family:var(--f-head);font-weight:700;color:var(--ink);font-size:1.45rem;margin:1.8em 0 .5em}
.article h3{font-family:var(--f-head);font-size:1.2rem;margin:1.4em 0 .4em}
.article p{margin:0 0 1.1em}
.article blockquote{margin:1.4em 0;padding:16px 20px;background:var(--g-gold-soft);border-left:5px solid var(--gold);border-radius:0 8px 8px 0}
.article blockquote p:last-child{margin:0}
.article table{border-collapse:collapse;width:100%;font-family:var(--f-body);font-size:.92rem;margin:1em 0;font-variant-numeric:tabular-nums}
.article th,.article td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left}
.article th{background:var(--mist);font-weight:600}
.tablewrap{overflow-x:auto}
.sources{margin-top:36px;padding-top:16px;border-top:2px solid var(--ink);font-size:.88rem}
.sources h2{font-size:1rem;letter-spacing:.1em;text-transform:uppercase}
.sources ol{padding-left:1.2em;display:grid;gap:4px;color:var(--muted)}
.sources a{color:var(--ink);word-break:break-word}
.postnav{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:36px}
.postnav a{border:1px solid var(--line);border-radius:var(--r);background:var(--g-grey);padding:14px;text-decoration:none;color:var(--ink);font-weight:500}
.postnav a:hover{border-color:var(--gold)}
.postnav small{display:block;color:var(--muted);font-size:.78rem}
.postnav .next{text-align:right}

/* featured */
.feat{background:var(--g-graphite);color:#fff;position:relative;overflow:hidden}
.feat::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 85% 15%,rgba(232,191,74,.28),transparent 45%),radial-gradient(circle at 5% 95%,rgba(255,255,255,.08),transparent 40%)}
.feat .wrap{position:relative;display:grid;grid-template-columns:1.15fr .85fr;gap:48px;align-items:center;padding-top:60px;padding-bottom:60px}
.ftag{display:inline-block;background:var(--g-gold);color:#241b05;font:700 .72rem var(--f-body);letter-spacing:.16em;text-transform:uppercase;padding:5px 12px;border-radius:4px}
.feat h2{font-size:clamp(2.3rem,4.8vw,3.6rem);margin:14px 0 6px;background:var(--g-gold);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:-.03em}
.feat .ftl{font-family:var(--f-serif);font-weight:600;font-size:1.5rem;color:#e9eaec;margin:0 0 14px}
.feat p.fb{font-size:1.02rem;line-height:1.75;margin:0 0 16px;color:#d9dce1}
.feat .lv{font-size:.9rem;color:var(--gold-l);margin:0 0 22px}
.wbtn.gold{background:var(--g-gold)}
.feat small.si{display:block;margin-top:10px;color:#aeb4bc;font-size:.85rem}
.journey{list-style:none;margin:0;padding:0;counter-reset:j;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.journey li{counter-increment:j;background:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,.04));border:1px solid rgba(255,255,255,.16);border-radius:8px;padding:12px 14px;font-weight:500;display:flex;gap:12px;align-items:center}
.journey li::before{content:counter(j,decimal-leading-zero);font:800 1.15rem var(--f-head);background:var(--g-gold);-webkit-background-clip:text;background-clip:text;color:transparent;font-variant-numeric:tabular-nums}
@media (max-width:860px){.feat .wrap{grid-template-columns:1fr}}

/* footer */
footer{position:relative;color:#fff;background:#1d2025 center/cover no-repeat}
footer::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(43,47,54,.82) 0%,rgba(29,32,37,.95) 60%,#1d2025 100%)}
footer::after{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:var(--g-gold)}
.fwrap{position:relative;display:grid;grid-template-columns:130px 1.3fr 1fr .8fr;gap:30px;padding:36px clamp(16px,4vw,48px) 40px 0;max-width:var(--wrap);margin:0 auto}
.pills{display:grid;gap:12px;align-content:start}
.pills a{display:flex;align-items:center;justify-content:center;height:56px;background:var(--g-grey2);color:var(--ink);text-decoration:none;font:600 15px var(--f-body);border-radius:0 30px 30px 0}
.pills a:first-child{background:var(--g-gold);color:#241b05}
.fname-big{font-family:var(--f-head);font-weight:800;font-size:clamp(1.8rem,3vw,2.4rem);line-height:1.1;background:var(--g-gold);-webkit-background-clip:text;background-clip:text;color:transparent}
.fsub{font-family:var(--f-read);font-size:1rem;margin:14px 0 28px;color:#d9dce1}
.mail{display:flex;gap:14px;align-items:center;font-size:.98rem}
.mail svg{width:46px;height:34px;flex:none}
.mail a{color:#fff;text-decoration:none;display:block}
.fcol h4{font-family:var(--f-head);font-weight:700;font-size:1.1rem;margin:0 0 10px}
.fcol h4 a{color:var(--gold-l)}
.fcol .grp{font-size:.92rem;line-height:1.55;margin-bottom:14px;color:#d9dce1}
.fcol .grp u{font-weight:600;text-decoration:none;color:#fff}
.fcol a{color:#d9dce1;text-decoration:none}
.fcol a:hover{color:#fff;text-decoration:underline}
.copy{text-align:center;color:var(--muted);font-size:.86rem;padding:14px;background:var(--g-grey2)}
@media (max-width:900px){.fwrap{grid-template-columns:1fr 1fr;padding-left:clamp(16px,4vw,48px)}.pills{grid-column:1/-1;grid-template-columns:repeat(4,1fr)}.pills a{border-radius:30px;height:46px}}
@media (max-width:560px){.fwrap{grid-template-columns:1fr}.pills{grid-template-columns:repeat(2,1fr)}}



.app{position:relative;background:linear-gradient(180deg,#fff,#f6f7f9);border:1px solid var(--line);border-radius:10px;padding:22px;display:flex;flex-direction:column;gap:10px;overflow:hidden}
.app::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:var(--g-gold)}
.app .ahead{display:flex;gap:12px;align-items:center}
.app .mono{width:44px;height:44px;border-radius:10px;background:var(--g-graphite);color:var(--gold-l);display:grid;place-items:center;font:800 1.05rem var(--f-head);flex:none}
.app h3{font-size:1.2rem}
.app .purpose{font-weight:600;color:var(--ink);font-size:.98rem;margin:0}
.app .desc{font-size:.93rem;color:var(--muted);margin:0;line-height:1.6}
.app .who{font-size:.82rem;color:var(--muted);margin:0}
.app .who b{color:var(--gold-d)}
.app .foot{margin-top:auto;padding-top:6px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
/* courses */
.cgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
@media (max-width:900px){.cgrid{grid-template-columns:repeat(2,1fr)}}
@media (max-width:560px){.cgrid{grid-template-columns:1fr}}
.ccard{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:linear-gradient(180deg,#fff,#f6f7f9);text-decoration:none;color:inherit;transition:box-shadow .15s,transform .15s}
.ccard:hover{box-shadow:0 12px 28px rgba(30,34,40,.12);transform:translateY(-2px)}
.ccard .ph{height:130px;background:#2a2e35 center/cover no-repeat;position:relative}
.ccard .ph::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(29,32,37,0) 40%,rgba(29,32,37,.55));}
.ccard .ph::before{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--g-gold);z-index:1}
.ccard .bd{padding:16px 18px 18px;display:grid;gap:6px}
.ccard h3{font-size:1.15rem}
.ccard p{margin:0;font-size:.88rem;color:var(--muted)}
.course{display:grid;grid-template-columns:250px 1fr;gap:40px;align-items:start}
@media (max-width:900px){.course{grid-template-columns:1fr}.toc{position:static!important}}
.toc{position:sticky;top:150px;background:var(--g-grey);border:1px solid var(--line);border-radius:10px;padding:16px 16px 12px;font-size:.88rem;max-height:calc(100vh - 170px);overflow:auto}
.toc b{display:block;font:600 .72rem var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--gold-d);margin-bottom:8px}
.toc a{display:block;color:var(--ink);text-decoration:none;padding:4px 0 4px 10px;border-left:2px solid var(--line);line-height:1.35}
.toc a.l1{font-weight:600;border-left-color:var(--gold);margin-top:6px}
.toc a:hover{color:var(--gold-d)}
.mats{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 26px}
.ctop{display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.bookcall{display:flex;gap:14px;align-items:center;background:var(--g-gold-soft);border:1px solid #ecd9a0;border-radius:10px;padding:12px 16px;margin:0 0 28px;text-decoration:none;color:var(--ink)}
.bookcall .cover{width:46px;aspect-ratio:2/3;padding:0;flex:none}
.bookcall .cover b,.bookcall .cover small{display:none}
.cbody h3.c1{font-family:var(--f-head);font-size:1.45rem;margin:34px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line);position:relative;scroll-margin-top:150px}
.cbody h3.c1::after{content:"";position:absolute;left:0;bottom:-1px;width:90px;height:2px;background:var(--g-gold)}
.cbody h4.c2{font-family:var(--f-head);font-weight:700;font-size:1.1rem;margin:22px 0 6px;scroll-margin-top:150px}
.cbody ul.pts{margin:0 0 6px;padding-left:20px}
.cbody ul.pts li{margin:2px 0}
.cbody .clabel{font:600 .7rem var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--gold-d);margin:12px 0 4px}
.cbody .clinks{display:grid;gap:6px;margin:0 0 6px}
.cbody .clinks a{display:flex;gap:10px;align-items:flex-start;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;text-decoration:none;color:var(--ink);font-size:.93rem;line-height:1.4}
.cbody .clinks a:hover{border-color:var(--gold)}
.cbody .clinks svg{width:18px;height:18px;flex:none;color:var(--gold-d);margin-top:1px}
.cbody .cnote{font-family:var(--f-read);font-style:italic;color:var(--muted)}
dialog{border:0;border-radius:12px;padding:26px;max-width:520px;width:calc(100% - 32px);font-family:var(--f-body);background:var(--g-grey);box-shadow:0 20px 60px rgba(0,0,0,.25)}
dialog::before{content:"";display:block;height:4px;margin:-26px -26px 22px;background:var(--g-gold);border-radius:12px 12px 0 0}
dialog::backdrop{background:rgba(29,32,37,.55)}
dialog h2{font-size:1.35rem;margin-bottom:8px}
dialog .subj{font-family:var(--f-read);background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:10px 0 16px;word-break:break-word}
.toast{font-size:.85rem;color:var(--gold-d);min-height:1.2em;margin-top:10px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

  ps.forEach(p=>{const m=p.date.slice(0,7);if(m!==cur){cur=m;out+=`<div class="month">${monthLabel(p.date)}</div>`;}
    const d=new Date(p.date+'T12:00:00');
    out+=`<a class="prow" href="#post-${p.slug}"><div class="d">${d.getDate()}<small>${lang==='vi'?'Th '+(d.getMonth()+1):d.toLocaleDateString('en-GB',{month:'short'})}</small></div><div><span class="cat">${icon(p.category)}${esc(catName(p.category))}</span><h3>${esc(pT(p))}</h3><p>${esc(pX(p))}</p></div></a>`;});
  return out;
}
function viewPost(slug){
  const i=POSTS.findIndex(p=>p.slug===slug); if(i<0) return viewNotFound();
  const p=POSTS[i],newer=POSTS[i-1],older=POSTS[i+1];
  const fb='https://www.facebook.com/sharer/sharer.php?u='+encodeURIComponent(location.href.split('#')[0]+'#post-'+p.slug);
  return `<div class="banner pagehead" ${bannerStyle()}><div class="wrap"><a href="#blog" class="crumb" style="text-decoration:none">← ${t('back')}</a><h1 style="max-width:900px">${esc(pT(p))}</h1><p>${esc(catName(p.category))} · ${fmtDate(p.date)} · ${p.reading_minutes||5} ${t('min')}</p></div></div>
  <section class="sec"><div class="wrap"><article class="post"><div class="article">${lang==='vi'?p.html_vi:p.html_en}</div>
    ${p.sources&&p.sources.length?`<div class="sources"><h2>${t('sources')}</h2><ol>${p.sources.map(s=>`<li><a href="${esc(s.url)}">${esc(s.title)}</a></li>`).join('')}</ol></div>`:''}
    <div class="btnrow"><a class="wbtn sm" href="${fb}">${t('share')} ↗</a><a class="wbtn sm ghost" href="${S.links.ysi}">${t('follow')} ↗</a></div>
    <nav class="postnav" aria-label="More posts">${older?`<a href="#post-${older.slug}"><small>← ${t('prev')}</small>${esc(pT(older))}</a>`:'<span></span>'}${newer?`<a class="next" href="#post-${newer.slug}"><small>${t('next')} →</small>${esc(pT(newer))}</a>`:'<span></span>'}</nav>
  </article></div></section>`;
}
function viewContact(){
  return pageHead('Hoang Dao, PhD',t('contact'),t('contactLede'))+`<section class="sec"><div class="wrap"><div class="grid g2">
    <div class="card"><span class="kicker">${t('email')}</span><h3><a href="mailto:${S.email}">${S.email}</a></h3></div>
    <div class="card"><span class="kicker">${t('work')}</span><h3 style="word-break:break-word"><a href="mailto:${S.emailWork}">${S.emailWork}</a></h3></div>
    <div class="card"><span class="kicker">Phenikaa University</span><p>Faculty of Interdisciplinary Digital Technology (FIDT)<br>Nguyen Trac Street, Yen Nghia Ward, Ha Dong, Hanoi, Vietnam</p></div>
    <div class="card"><span class="kicker">Online</span><p><a href="${S.links.linkedin}">LinkedIn</a> · <a href="${S.links.orcid}">ORCID</a> · <a href="${S.links.ysiWeb}">YSI</a> · <a href="${S.links.ysi}">YSI on Facebook</a> · <a href="${S.links.gaea}">GAEA</a></p></div>
  </div></div></section>`;
}

const LICON={video:'<path d="M8 5v14l11-7z"/>',read:'<path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 12h7M9 16h7"/>',data:'<path d="M5 20V12M10 20V6M15 20v-9M20 20V9"/>'};
const cimg=id=>IMG['course-'+id]||('img/course-'+id+'.jpg');
const C=id=>S.courses.find(c=>c.id===id);
function courseCard(c){const n=c.blocks.filter(b=>b[0]==='h2').length, v=c.blocks.filter(b=>b[0]==='link'&&b[3]==='video').length, r=c.blocks.filter(b=>b[0]==='link'&&b[3]!=='video').length;
  return `<a class="ccard" href="#course-${c.id}"><div class="ph" style="background-image:url('${cimg(c.id)}')"></div><div class="bd"><h3>${esc(L(c.title))}</h3>${c.alt?`<p>${esc(c.alt)}</p>`:''}<p>${(lang==='vi'?[n+' chủ đề',v&&v+' video',r&&r+' bài đọc và dữ liệu',c.materials.length+' tài liệu tải về']:[n+' topics',v&&v+' videos',r&&r+' readings and data',c.materials.length+' downloads']).filter(Boolean).join(' · ')}</p></div></a>`;}
function viewCourse(id){
  const c=C(id); if(!c) return viewNotFound();
  let body='',toc='',ul=null,lk=null,n=0;
  const close=()=>{if(ul!==null){body+=`<ul class="pts">${ul}</ul>`;ul=null;} if(lk!==null){body+=`<div class="clinks">${lk}</div>`;lk=null;}};
  c.blocks.forEach(b=>{
    if(b[0]==='h1'||b[0]==='h2'){close();const a='cs-'+(n++);toc+=`<a class="${b[0]==='h1'?'l1':''}" href="#course-${c.id}" data-jump="${a}">${esc(b[1])}</a>`;body+=b[0]==='h1'?`<h3 class="c1" id="${a}">${esc(b[1])}</h3>`:`<h4 class="c2" id="${a}">${esc(b[1])}</h4>`;}
    else if(b[0]==='label'){close();body+=`<div class="clabel">${esc(b[1])}</div>`;}
    else if(b[0]==='note'){close();body+=`<p class="cnote">${esc(b[1])}</p>`;}
    else if(b[0]==='li'){if(lk!==null){body+=`<div class="clinks">${lk}</div>`;lk=null;} ul=(ul||'')+`<li>${esc(b[1])}</li>`;}
    else if(b[0]==='link'){if(ul!==null){body+=`<ul class="pts">${ul}</ul>`;ul=null;} lk=(lk||'')+`<a href="${esc(b[2])}"><svg viewBox="0 0 24 24" aria-hidden="true"><g class="icon">${LICON[b[3]]||LICON.read}</g></svg><span>${esc(b[1])}</span></a>`;}
  }); close();
  const bk=c.book&&S.books.find(x=>x.id===c.book);
  const others=S.courses.filter(x=>x.id!==c.id);
  return `<div class="banner pagehead" style="background-image:url('${cimg(c.id)}')"><div class="wrap"><a href="#teaching" class="crumb" style="text-decoration:none">← ${lang==='vi'?'Tất cả môn học':'All courses'}</a><h1>${esc(L(c.title))}</h1>${c.alt?`<p>${esc(c.alt)}</p>`:''}</div></div>
  <section class="sec"><div class="wrap">
    <div class="mats">${c.materials.map(m=>`<a class="wbtn sm" href="${esc(m[1])}">${esc(m[0])} ↓</a>`).join('')}</div>
    ${bk?`<a class="bookcall" href="#book-${bk.id}">${coverHTML(bk,'#book-'+bk.id).replace('<a ','<span ').replace('</a>','</span>')}<span><b>${lang==='vi'?'Giáo trình đi kèm':'Companion textbook'}:</b> ${esc(bk.title)}</span></a>`:''}
    <div class="course"><nav class="toc" aria-label="${lang==='vi'?'Mục lục':'Contents'}"><b>${lang==='vi'?'Nội dung':'Contents'}</b>${toc}</nav><div class="cbody">${body}</div></div>
    <h2 class="sub">${lang==='vi'?'Các môn khác':'Other courses'}</h2><div class="cgrid">${others.slice(0,3).map(courseCard).join('')}</div>
  </div></section>`;
}

function appCard(a){const mono=a.name.split(/[\s&]+/).filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase();
  const bk=a.book?S.books.find(b=>b.id===a.book):null;
  return `<article class="app"><div class="ahead"><span class="mono">${esc(mono)}</span><div><span class="kicker">${esc(L(a.kind))}</span><h3>${esc(a.name)}</h3></div></div>
  <p class="purpose">${esc(L(a.purpose))}</p><p class="desc">${esc(L(a.desc))}</p><p class="who"><b>${t('forWho')}:</b> ${esc(L(a.who))}</p>
  <div class="foot"><a class="wbtn sm" href="${a.url}">${t('visit')} ↗</a>${bk?`<a class="wbtn sm ghost" href="#book-${bk.id}">${esc(bk.title.split(':')[0])}</a>`:''}</div></article>`;}
function appsByGroup(){const order=Object.keys(S.appGroups);const as=S.apps.slice().sort((a,b)=>order.indexOf(a.group)-order.indexOf(b.group));return `<h2 class="sub" style="margin-top:0">${lang==='vi'?'Tất cả ứng dụng':'All apps'} <span style="font-weight:400;font-size:1rem;color:var(--muted)">(${as.length+1})</span></h2><div class="grid g3">${as.map(appCard).join('')}</div>`;}
function viewNotFound(){return `<section class="sec"><div class="wrap"><p>${t('notFound')} <a href="#home">→</a></p></div></section>`;}

function route(){
  const h=(location.hash||'#home').slice(1)||'home'; let active=h,html,scrollTo=null;
  if(h==='home') html=viewHome();
  else if(h==='about') html=viewAbout();
  else if(h==='research'){resFilter='all';html=viewResearch();}
  else if(h.startsWith('research-')){const g=h.slice(9);resFilter=S.groups[g]?g:'all';active='research';html=viewResearch();scrollTo='field-'+g;}
  else if(h==='books') html=viewBooks();
  else if(h.startsWith('book-')){active='books';html=viewBooks();scrollTo=h;}
  else if(h==='projects') html=viewProjects();
  else if(h==='teaching') html=viewTeaching();
  else if(h.startsWith('course-')){active='teaching';html=viewCourse(h.slice(7));}
  else if(h==='blog') html=viewBlog();
  else if(h.startsWith('blog-')){const c=h.slice(5);blogCat=S.categories[c]?c:'all';active='blog';html=viewBlog();}
  else if(h.startsWith('post-')){active='blog';html=viewPost(h.slice(5));}
  else if(h==='contact') html=viewContact();
  else {html=viewNotFound();active='';}
  renderChrome(active);
  document.getElementById('app').innerHTML=html;
  document.querySelectorAll('.article table').forEach(tb=>{const w=document.createElement('div');w.className='tablewrap';tb.replaceWith(w);w.appendChild(tb);});
  document.getElementById('mainNav').classList.remove('open');
  const p=h.startsWith('post-')?POSTS.find(x=>x.slug===h.slice(5)):null;
  document.title=p?pT(p)+' · Hoang Dao':'Hoang Dao, PhD';
  return scrollTo;
}
function go(){const s=route();if(s){const el=document.getElementById(s);if(el){el.scrollIntoView({block:'start'});return;}}window.scrollTo(0,0);}
window.addEventListener('hashchange',go);

document.addEventListener('click',e=>{
  if(e.target.id==='expandAll'){document.querySelectorAll('details.field').forEach(d=>d.open=true);return;}
  if(e.target.id==='collapseAll'){document.querySelectorAll('details.field').forEach(d=>d.open=false);return;}
  const j=e.target.closest('[data-jump]'); if(j){e.preventDefault();const el=document.getElementById(j.dataset.jump);if(el)el.scrollIntoView({behavior:'smooth',block:'start'});return;}
  const c=e.target.closest('[data-cat]');
  if(c){blogCat=c.dataset.cat;document.querySelectorAll('[data-cat]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.cat===blogCat));document.getElementById('plist').innerHTML=postList();document.getElementById('catdesc').textContent=blogCat!=='all'?(lang==='vi'?S.categories[blogCat].d_vi:S.categories[blogCat].d_en):'';return;}
  const r=e.target.closest('[data-req]'); if(r){const p=S.papers.find(x=>x.id===r.dataset.req);openReq('Paper request: '+p.title,t('reqTitle'),p.title);return;}
  const b=e.target.closest('[data-book]'); if(b){const k=S.books.find(x=>x.id===b.dataset.book);openReq((k.notify?'Book update: ':'Book copy request: ')+k.title,k.notify?t('reqTitleNotify'):t('reqTitleBook'),k.title);}
});
document.addEventListener('input',e=>{if(e.target.id==='q'){blogQ=e.target.value;document.getElementById('plist').innerHTML=postList();}});
document.getElementById('topSearch').addEventListener('keydown',e=>{if(e.key==='Enter'){blogQ=e.target.value;blogCat='all';if(location.hash==='#blog'){route();}else{location.hash='blog';}}});
function setLang(l){lang=l;try{localStorage.setItem('hd-lang',l)}catch(e){}route();}
document.getElementById('lang-en').onclick=()=>setLang('en');
document.getElementById('lang-vi').onclick=()=>setLang('vi');
document.getElementById('menuBtn').onclick=()=>{const n=document.getElementById('mainNav');const o=n.classList.toggle('open');document.getElementById('menuBtn').setAttribute('aria-expanded',o);};

const dlg=document.getElementById('reqDlg');
function openReq(subj,title,what){
  document.getElementById('reqTitle').textContent=title;
  document.getElementById('reqText').innerHTML=esc(t('reqText'))+' <b>'+S.email+'</b>';
  document.getElementById('reqSubj').textContent=subj;
  document.getElementById('reqMail').href='mailto:'+S.email+'?subject='+encodeURIComponent(subj)+'&body='+encodeURIComponent('Dear Dr. Dao,\n\nI am writing about "'+what+'".\n\nName:\nAffiliation:\n\nThank you!');
  document.getElementById('reqCopy').textContent=t('copy');document.getElementById('reqClose').textContent=t('close');document.getElementById('reqToast').textContent='';
  dlg.dataset.subj=subj; if(dlg.showModal) dlg.showModal(); else dlg.setAttribute('open','');
}
document.getElementById('reqClose').onclick=()=>dlg.close();
document.getElementById('reqCopy').onclick=async()=>{try{await navigator.clipboard.writeText(S.email+'\n'+dlg.dataset.subj);document.getElementById('reqToast').textContent=t('copied');}catch(e){document.getElementById('reqToast').textContent=t('copyFail')+S.email;}};
dlg.addEventListener('click',e=>{if(e.target===dlg)dlg.close();});
go();
})();
</script>
</body>
</html>
